<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Slide Fifteen</title>
<meta name="description" content="The classic sliding tile puzzle. Every board here is generated by legal moves from the solved state, so it is always solvable.">
<script src="https://sdk.crazygames.com/crazygames-sdk-v2.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;user-select:none;-webkit-user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#0a0d13;
  font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;color:#e8ecf4}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
canvas{display:block;background:#101725}
#hud{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;
  padding:2.4% 3%;font-size:17px;font-weight:700;pointer-events:none;font-variant-numeric:tabular-nums;text-shadow:0 1px 3px #000}
#hint{position:absolute;left:0;right:0;bottom:11%;text-align:center;font-size:min(4.4vw,18px);color:#cfd8ea;pointer-events:none}
#mute,#undo{position:absolute;top:9%;padding:1% 2.2%;border:0;border-radius:9px;background:rgba(16,23,37,.82);
  color:#e8ecf4;font-size:15px;cursor:pointer}
#mute{right:1.5%}#undo{left:1.5%}
#over{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  background:rgba(10,13,19,.9);text-align:center;padding:6%}
#over.on{display:flex}
#over h2{font-size:min(8vw,40px);margin:0}
#over .stats{font-size:min(4.6vw,20px);color:#cfd8ea}
button{min-height:44px;min-width:44px}
</style></head>
<body>
<div id="wrap">
  <canvas id="cv" width="420" height="560"></canvas>
  <div id="hud"><span>MOVES <b id="s">0</b></span><span>BOARD <b id="x">1</b></span><span>BEST <b id="v">0</b></span></div>
  <div id="hint">Tap a tile next to the gap, or use the arrow keys.</div>
  <button id="undo" type="button">UNDO</button>
  <button id="mute" type="button">SOUND ON</button>
  <div id="over"><h2 id="oht">SOLVED</h2><p class="stats" id="stats"></p><p style="color:#9aa6bd;font-size:min(4vw,17px)">TAP or SPACE for the next board</p></div>
</div>
<script>
"use strict";
const cv=document.getElementById("cv"),cx=cv.getContext("2d"),
 sEl=document.getElementById("s"),xEl=document.getElementById("x"),vEl=document.getElementById("v"),
 overEl=document.getElementById("over"),stEl=document.getElementById("stats"),oht=document.getElementById("oht");
function rng32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const CG=(typeof window.CrazyGames!=="undefined")?window.CrazyGames:null;
function adBreak(kind){try{window.__adRequests=(window.__adRequests||0)+1;if(!(CG&&CG.SDK&&CG.SDK.ad&&typeof CG.SDK.ad.requestAd==="function"))return false;CG.SDK.ad.requestAd(kind,{adStarted:function(){window.__adState="started";try{if(actx&&actx.state==="running"){actx.suspend();window.__mutedForAd=true;}}catch(e){}},adFinished:function(){window.__adState="finished";try{if(actx&&window.__mutedForAd&&!muted){actx.resume();}window.__mutedForAd=false;}catch(e){}},adError:function(){window.__adState="error";try{if(actx&&window.__mutedForAd&&!muted){actx.resume();}window.__mutedForAd=false;}catch(e){}}});return true;}catch(e){window.__adState="threw";return false;}}
function sdkEvent(n){try{if(!(CG&&CG.SDK&&CG.SDK.game))return false;var m={GameplayStart:"gameplayStart",GameplayEnd:"gameplayStop",LoadingStart:"sdkGameLoadingStart",LoadingStop:"sdkGameLoadingStop"}[n];if(m&&typeof CG.SDK.game[m]==="function"){CG.SDK.game[m]();return true;}return false;}catch(e){return false;}}
function store(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}

// ---- solvability maths ----------------------------------------------------
// The blank counts as the last row for the parity test; with a grid of even
// width the row of the blank flips the requirement, which is why the classic
// 14-15 swap is impossible.
function inversions(perm){let n=0;const t=perm.filter(v=>v!==0);
  for(let i=0;i<t.length;i++)for(let j=i+1;j<t.length;j++)if(t[i]>t[j])n++;return n}
function isSolvable(perm,size){const blankRow=Math.floor(perm.indexOf(0)/size);
  if(size%2===1)return inversions(perm)%2===0;
  const fromBottom=size-blankRow;
  return (inversions(perm)+(fromBottom%2===0?1:0))%2===0}
function solvedPerm(size){const a=[];for(let i=1;i<size*size;i++)a.push(i);a.push(0);return a}
function blankIndex(perm){return perm.indexOf(0)}
function neighbors(i,size){const r=Math.floor(i/size),c=i%size,out=[];
  if(r>0)out.push(i-size);if(r<size-1)out.push(i+size);if(c>0)out.push(i-1);if(c<size-1)out.push(i+1);return out}
function scramble(size,k,rnd){const p=solvedPerm(size);let b=blankIndex(p),prev=-1;
  for(let step=0;step<k;step++){const opts=neighbors(b,size).filter(i=>i!==prev);
   const pick=opts[Math.floor(rnd()*opts.length)];p[b]=p[pick];p[pick]=0;prev=b;b=pick}
  return p}
// IDA* over the Manhattan distance. Exact, and small enough to run in a test
// for 3x3 boards and lightly scrambled 4x4 boards.
function optimalMoves(perm,size,limit){const goal=[];
  for(let i=0;i<size*size;i++)goal[(i+1)%(size*size)]=i;   // goal position of each value
  const h=p=>{let d=0;for(let i=0;i<p.length;i++){const v=p[i];if(!v)continue;
    d+=Math.abs(Math.floor(goal[v]/size)-Math.floor(i/size))+Math.abs(goal[v]%size-i%size)}return d};
  let bound=h(perm),path=null,nodes=0;
  const stack=[{p:perm.slice(),g:0,b:blankIndex(perm),from:-1}];
  while(bound<=limit){
   const st=[{p:perm.slice(),g:0,b:blankIndex(perm),from:-1}];
   while(st.length){const cur=st.pop();const f=cur.g+h(cur.p);
    if(f>bound)continue;nodes++;
    if(h(cur.p)===0){path=cur.g;break}
    for(const nb of neighbors(cur.b,size)){if(nb===cur.from)continue;
      const np=cur.p.slice();np[cur.b]=np[nb];np[nb]=0;
      st.push({p:np,g:cur.g+1,b:nb,from:cur.b})}}
   if(path!==null)break;bound+=1}
  return {moves:path===null?null:path,nodes:nodes}
}

const SIZES=[3,3,3,4,4,4];
const sim={
 seed:1,level:1,size:3,perm:[],moves:0,state:"ready",history:[],scrambleLen:0,
 score:0,best:+store("sf_best")||0,
 newBoard(seed){if(seed)this.seed=seed;this.level=1;this.build();
  this.state="ready";overEl.classList.remove("on");sdkEvent("LoadingStop");return this},
 build(){this.size=SIZES[Math.min(this.level-1,SIZES.length-1)];
  const rnd=rng32(this.seed*2654435761+this.level*40503+7);
  this.scrambleLen=6+this.level*3;
  this.perm=scramble(this.size,this.scrambleLen,rnd);
  this.history=[];this.moves=0;sEl.textContent=0;xEl.textContent=this.level;vEl.textContent=this.best},
 tap(i){if(i<0||i>=this.perm.length)return false;
  if(this.state==="won")return false;
  if(!neighbors(blankIndex(this.perm),this.size).includes(i))return false;
  this.history.push({perm:this.perm.slice(),moves:this.moves});
  const b=blankIndex(this.perm);const p=this.perm.slice();p[b]=p[i];p[i]=0;this.perm=p;
  this.moves++;sEl.textContent=this.moves;
  if(this.state!=="running")this.start();
  sfx("slide",0.25);
  if(isGoal(this.perm)){this.state="won";this.finish();}else draw();
  return true},
 key(k){const b=blankIndex(this.perm),size=this.size,r=Math.floor(b/size),c=b%size;
  let t=-1;if(k==="ArrowLeft"&&c<size-1)t=b+1;if(k==="ArrowRight"&&c>0)t=b-1;
  if(k==="ArrowUp"&&r<size-1)t=b+size;if(k==="ArrowDown"&&r>0)t=b-size;
  return this.tap(t)},
 undo(){if(!this.history.length)return false;const h=this.history.pop();this.perm=h.perm;this.moves=h.moves;
  sEl.textContent=this.moves;sfx("slide",0.18);draw();return true},
 finish(){this.score+=Math.max(10,200-this.moves*4);
  if(this.score>this.best){this.best=this.score;store("sf_best",String(this.score))}
  vEl.textContent=this.best;oht.textContent="SOLVED";
  stEl.textContent="BOARD "+this.level+" IN "+this.moves+" MOVES  ·  SCORE "+this.score;
  overEl.classList.add("on");sfx("win",0.5);sdkEvent("GameplayEnd");draw();
  try{if(CG&&CG.SDK&&CG.SDK.ad)adBreak("midgame")}catch(e){}},
 next(){this.level++;this.build();this.state="running";return this.level},
 start(){if(this.state==="running")return;this.state="running";sdkEvent("GameplayStart")},
 geom(){const pad=Math.round(Math.min(W,H)*0.04);
  const side=Math.max(120,Math.min(W,H)-pad*2-Math.min(W,H)*0.18);
  const cs=Math.floor(side/this.size);
  return {cs:cs,ox:Math.round((W-cs*this.size)/2),oy:Math.round((H-cs*this.size)/2),size:this.size}},
 cellAt(x,y){const g=this.geom();const c=Math.floor((x-g.ox)/g.cs),r=Math.floor((y-g.oy)/g.cs);
  if(r<0||c<0||r>=this.size||c>=this.size)return -1;return r*this.size+c},
 sum(){return this.perm.reduce((a,b)=>a+b,0)},
 probe(){return {state:this.state,level:this.level,seed:this.seed,size:this.size,moves:this.moves,
   score:this.score,best:this.best,perm:this.perm.slice(),blank:this.perm.indexOf(0),
   scramble_len:this.scrambleLen,solvable_by_parity:isSolvable(this.perm,this.size),
   solved:isGoal(this.perm),history:this.history.length,fps:Math.round(fps),
   stage:[W,H],geom:this.geom()}},
 solve(limit){return optimalMoves(this.perm,this.size,limit===undefined?60:limit)}
};
function isGoal(p){for(let i=0;i<p.length;i++)if(p[i]!==(i+1)%p.length)return false;return true}

const SFXN=["slide","win"],bufs={};let actx=null,muted=store("sf_muted")==="1";
const muteEl=document.getElementById("mute"),undoEl=document.getElementById("undo");
muteEl.textContent=muted?"SOUND OFF":"SOUND ON";undoEl.textContent="UNDO";
function audioWake(){if(actx||muted)return;try{actx=new (window.AudioContext||window.webkitAudioContext)();
 SFXN.forEach(n=>fetch(n+".ogg").then(r=>r.arrayBuffer()).then(b=>actx.decodeAudioData(b)).then(buf=>{bufs[n]=buf}).catch(()=>{}))}catch(e){}}
function sfx(name,vol){if(muted||!actx)return;const b=bufs[name];if(!b)return;
 try{const s=actx.createBufferSource();s.buffer=b;const g=actx.createGain();g.gain.value=vol;
  s.connect(g);g.connect(actx.destination);s.start()}catch(e){}}

let W=0,H=0,PIX=1;
function layout(){W=innerWidth;H=innerHeight;PIX=Math.min(W,H)/560;
 cv.width=W;cv.height=H;cv.style.width=W+"px";cv.style.height=H+"px";
 document.documentElement.style.fontSize=Math.max(13,Math.round(17*PIX))+"px";draw()}
addEventListener("resize",layout);
addEventListener("wheel",e=>e.preventDefault(),{passive:false});
addEventListener("keydown",e=>{const k=e.key;
 if(["ArrowLeft","ArrowRight","ArrowUp","ArrowDown"," "].includes(k))e.preventDefault();
 if(k==="z")sim.undo();
 else if(k===" "&&sim.state==="won")sim.next();
 else if(k.indexOf("Arrow")===0)sim.key(k)},{passive:false});
let sx=0,sy=0;
cv.addEventListener("pointerdown",e=>{sx=e.clientX;sy=e.clientY;
 if(sim.state==="won"){sim.next();return}},{passive:true});
cv.addEventListener("pointerup",e=>{if(Math.abs(e.clientX-sx)>12||Math.abs(e.clientY-sy)>12)return;
 sim.tap(sim.cellAt(e.clientX,e.clientY))},{passive:true});
muteEl.addEventListener("click",e=>{e.stopPropagation();muted=!muted;store("sf_muted",muted?"1":"0");
 muteEl.textContent=muted?"SOUND OFF":"SOUND ON"});
undoEl.addEventListener("click",e=>{e.stopPropagation();sim.undo()});
addEventListener("pointerdown",audioWake);addEventListener("keydown",audioWake);
document.addEventListener("visibilitychange",()=>{if(document.hidden&&sim.state==="running")sim.state="paused"});

const PAL=["#4b6fa8","#3f8f7a","#8f7a3f","#a85f4b","#6f4ba8","#4ba89a","#a89a4b","#7a4b4b",
           "#4b7aa8","#8f4ba8","#4ba85f","#a8704b","#5f8fa8","#a84b7a","#7aa84b"];
function draw(){const g=sim.geom(),cs=g.cs,size=g.size;
 cx.fillStyle="#0d1220";cx.fillRect(0,0,W,H);
 for(let i=0;i<size*size;i++){const v=sim.perm[i];const r=Math.floor(i/size),c=i%size;
  const x=g.ox+c*cs,y=g.oy+r*cs;
  if(!v){cx.fillStyle="#0f1725";cx.fillRect(x+2,y+2,cs-4,cs-4);continue}
  cx.fillStyle=PAL[(v-1)%PAL.length];cx.fillRect(x+2,y+2,cs-4,cs-4);
  const home=(v-1)===i;cx.fillStyle=home?"#0b1018":"#0b1018";
  cx.font="800 "+Math.round(cs*0.42)+"px system-ui";cx.textAlign="center";cx.textBaseline="middle";
  cx.fillStyle="#0a0d13";cx.fillText(String(v),x+cs/2,y+cs/2);
  if(home){cx.strokeStyle="#ffd166";cx.lineWidth=3;cx.strokeRect(x+5,y+5,cs-10,cs-10)}}
 cx.strokeStyle="#33425e";cx.lineWidth=2;cx.strokeRect(g.ox-1,g.oy-1,cs*size+2,cs*size+2)}
let frames=0,t0=null,last=performance.now(),fps=0;
function loop(now){if(t0===null)t0=now;frames++;last=now;
 if(now-t0>500){fps=frames/((now-t0)/1000);frames=0;t0=null}requestAnimationFrame(loop)}
window.__game=sim;window.FIFTEEN={inversions,isSolvable,solvedPerm,scramble,neighbors,optimalMoves,isGoal};
sim.newBoard(1);layout();requestAnimationFrame(loop);
</script>
</body></html>
