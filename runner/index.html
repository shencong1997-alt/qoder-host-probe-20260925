<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Lane Runner</title>
<meta name="description" content="Dodge the blocks, grab the coins, keep your combo alive. One-button arcade runner.">
<script src="https://sdk.crazygames.com/crazygames-sdk-v2.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;user-select:none;-webkit-user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#05070b;
  font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;color:#e8ecf4}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
canvas{display:block;background:#0b1220}
#hud{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;
  padding:2.2% 3%;font-size:18px;font-weight:700;pointer-events:none;
  font-variant-numeric:tabular-nums;text-shadow:0 1px 3px #000}
#hud .combo{color:#ffd166}
#over{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;
  justify-content:center;gap:10px;background:rgba(5,7,11,.85);text-align:center;padding:6%}
#over.on{display:flex}
#over h2{font-size:min(9vw,46px);margin:0}
#over .stats{font-size:min(5vw,22px);color:#cfd8ea;font-variant-numeric:tabular-nums}
#over .hint{font-size:min(4vw,17px);color:#9aa6bd}
#hint{position:absolute;left:0;right:0;bottom:18%;text-align:center;font-size:min(4.5vw,19px);
  color:#cfd8ea;text-shadow:0 1px 3px #000;pointer-events:none}
#mute{position:absolute;top:1.5%;right:1.5%;width:9.5%;min-width:44px;aspect-ratio:1/1;border:0;
  border-radius:9px;background:rgba(13,18,32,.72);color:#e8ecf4;font-size:15px;cursor:pointer}
button{min-height:44px;min-width:44px}
</style></head>
<body>
<div id="wrap">
  <canvas id="cv" width="420" height="560"></canvas>
  <div id="hud"><span>SCORE <b id="s">0</b></span><span class="combo">x<b id="c">1</b></span><span>BEST <b id="b">0</b></span></div>
  <div id="hint">← → or tap to move · grab coins, keep the combo</div>
  <button id="mute" type="button" aria-label="toggle sound">SOUND ON</button>
  <div id="over"><h2>GAME OVER</h2><p class="stats" id="stats"></p><p class="hint">Press SPACE or tap to run again</p></div>
</div>
<script>
"use strict";
const LANES = 5;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const cv=document.getElementById("cv"),cx=cv.getContext("2d"),
      overEl=document.getElementById("over"),sEl=document.getElementById("s"),
      cEl=document.getElementById("c"),bEl=document.getElementById("b"),stEl=document.getElementById("stats");
let W=0,H=0,LANE_W=0,SCALE=1;

// Portals demand legibility from 800x450 phones to 1920x1080 desktops, so every
// dimension derives from the stage rather than a fixed pixel box.
function resize(){
  const aw=innerWidth,ah=innerHeight;
  let h=Math.min(ah,900),w=h*0.75;
  if(w>aw){w=aw;h=w/0.75}
  W=Math.round(w);H=Math.round(h);LANE_W=W/LANES;SCALE=H/560;
  cv.width=W;cv.height=H;cv.style.width=W+"px";cv.style.height=H+"px";
  document.documentElement.style.fontSize=Math.max(14,Math.round(17*SCALE))+"px";
  draw();
}
addEventListener("resize",resize);
addEventListener("wheel",e=>e.preventDefault(),{passive:false});
addEventListener("keydown",e=>{
  if(["ArrowLeft","ArrowRight","ArrowUp","ArrowDown","Space"].includes(e.code))e.preventDefault();
  if(e.code==="ArrowLeft")sim.key("ArrowLeft");
  else if(e.code==="ArrowRight")sim.key("ArrowRight");
  else if(e.code==="Space"&&sim.state==="over")sim.restart();
  draw();
},{passive:false});
cv.addEventListener("pointerdown",e=>{
  if(sim.state==="over"){sim.restart();draw();return}
  sim.key(e.clientX<innerWidth/2?"ArrowLeft":"ArrowRight");draw()});

const CG=(typeof window.CrazyGames!=="undefined")?window.CrazyGames:null;
function adBreak(kind){try{window.__adRequests=(window.__adRequests||0)+1;if(!(CG&&CG.SDK&&CG.SDK.ad&&typeof CG.SDK.ad.requestAd==="function"))return false;CG.SDK.ad.requestAd(kind,{adStarted:function(){window.__adState="started";try{if(actx&&actx.state==="running"){actx.suspend();window.__mutedForAd=true;}}catch(e){}},adFinished:function(){window.__adState="finished";try{if(actx&&window.__mutedForAd&&!muted){actx.resume();}window.__mutedForAd=false;}catch(e){}},adError:function(){window.__adState="error";try{if(actx&&window.__mutedForAd&&!muted){actx.resume();}window.__mutedForAd=false;}catch(e){}}});return true;}catch(e){window.__adState="threw";return false;}}
function sdkEvent(n){try{if(!(CG&&CG.SDK&&CG.SDK.game))return false;var m={GameplayStart:"gameplayStart",GameplayEnd:"gameplayStop",LoadingStart:"sdkGameLoadingStart",LoadingStop:"sdkGameLoadingStop"}[n];if(m&&typeof CG.SDK.game[m]==="function"){CG.SDK.game[m]();return true;}return false;}catch(e){return false;}}
function store(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}

// Synthesised locally (numpy -> ffmpeg libvorbis), shipped as relative files, so
// the bundle stays self-contained and small.
const AC=window.AudioContext||window.webkitAudioContext;
let actx=null,buffers={},muted=store("lr_muted")==="1",shake=0,parts=[];
const hintEl=document.getElementById("hint"),muteEl=document.getElementById("mute");
function audioWake(){
  if(actx||!AC)return;
  try{actx=new AC();
    for(const n of ["coin","shield","block","over","die"])
      fetch(n+".ogg").then(r=>r.arrayBuffer()).then(b=>actx.decodeAudioData(b)).then(a=>{buffers[n]=a}).catch(()=>{})
  }catch(e){actx=null}
}
function sfx(n,vol){
  if(muted||!actx||!buffers[n])return;
  try{const src=actx.createBufferSource(),g=actx.createGain();
    src.buffer=buffers[n];g.gain.value=vol===undefined?0.5:vol;
    src.connect(g);g.connect(actx.destination);src.start()}catch(e){}
}
function renderHudControls(){muteEl.textContent=muted?"SOUND OFF":"SOUND ON";muteEl.style.opacity=muted?.55:1}
muteEl.addEventListener("click",e=>{e.stopPropagation();muted=!muted;store("lr_muted",muted?"1":"0");renderHudControls()});
addEventListener("pointerdown",audioWake,{once:false});addEventListener("keydown",audioWake);
document.addEventListener("visibilitychange",()=>{if(document.hidden&&sim.state==="running")sim.pause()});
function burst(lane,color){const x=lane*LANE_W+LANE_W/2,y=H-60*SCALE+15*SCALE;
  for(let i=0;i<9;i++)parts.push({x,y,vx:((i%5)-2)*1.7*SCALE,vy:-(1.4+(i%3))*SCALE,life:26,color})}

const sim={
  seed:1,rng:null,frame:0,lane:2,score:0,combo:1,bestCombo:1,coins:0,shield:0,
  best:+(store("lr_best")||0),state:"ready",obs:[],coinsRow:[],power:[],
  speed:4,nextRow:60,framesToOver:-1,adRequested:0,
  reset(seed){
    this.seed=seed||1;this.rng=mulberry32(this.seed);
    this.frame=0;this.lane=2;this.score=0;this.combo=1;this.bestCombo=1;
    this.coins=0;this.shield=0;this.state="ready";
    this.obs=[];this.coinsRow=[];this.power=[];this.speed=4;this.nextRow=60;this.framesToOver=-1;
    sdkEvent("LoadingStop");overEl.classList.remove("on");return this},
  restart(){this.reset(this.seed);this.start()},
  start(){if(this.state==="running")return;this.state="running";sdkEvent("GameplayStart")},
  pause(){if(this.state==="running"){this.state="paused";sdkEvent("GameplayEnd")}else if(this.state==="ready")this.start()},
  key(k){if(k==="ArrowLeft"&&this.lane>0)this.lane--;else if(k==="ArrowRight"&&this.lane<LANES-1)this.lane++;return this.lane},
  die(){
    this.state="over";this.framesToOver=this.frame;
    if(this.score>this.best){this.best=this.score;store("lr_best",String(this.best))}
    sdkEvent("GameplayEnd");shake=16*SCALE;sfx("die",0.6);sfx("over",0.35);
    stEl.textContent="SCORE "+this.score+"  ·  COINS "+this.coins+"  ·  BEST COMBO x"+this.bestCombo;
    overEl.classList.add("on");
    try{if(CG&&CG.SDK&&CG.SDK.ad){this.adRequested++;adBreak("midgame")}}catch(e){}
  },
  step(n){
    n=n||1;
    for(let i=0;i<n;i++){
      if(this.state!=="running"){if(this.state==="ready")this.start();else continue}
      this.frame++;
      // Rows arrive on a clock and always leave at least one escape lane, so a
      // loss is the player's read rather than an unavoidable wall.
      if(this.frame>=this.nextRow){
        const k=this.frame<1200?1:(this.rng()<0.35?2:1);
        const lanes=[0,1,2,3,4];
        for(let j=lanes.length-1;j>0;j--){const t=Math.floor(this.rng()*(j+1));const x=lanes[j];lanes[j]=lanes[t];lanes[t]=x}
        for(let j=0;j<k;j++)this.obs.push({y:-30,lane:lanes[j]});
        const free=lanes.slice(k);
        if(this.rng()<0.6)this.coinsRow.push({y:-30,lane:free[Math.floor(this.rng()*free.length)]});
        if(this.shield===0&&this.rng()<0.04)this.power.push({y:-30,lane:free[Math.floor(this.rng()*free.length)]});
        this.nextRow=this.frame+Math.max(26,Math.round(96-this.frame/220));
      }
      const mv=this.speed*SCALE;
      for(const o of this.obs)o.y+=mv;
      for(const o of this.coinsRow)o.y+=mv;
      for(const o of this.power)o.y+=mv;
      this.obs=this.obs.filter(o=>o.y<H+40);
      const cy=H-60*SCALE+15*SCALE;
      // Pickups resolve before collisions, so a coin and a block landing on the
      // same frame never reads as an unfair death.
      this.coinsRow=this.coinsRow.filter(o=>{
        if(o.lane===this.lane&&Math.abs(o.y+15*SCALE-cy)<30*SCALE){
          this.coins++;this.combo=Math.min(8,this.combo+1);this.bestCombo=Math.max(this.bestCombo,this.combo);
          burst(o.lane,"#ffd166");sfx("coin",0.45);hintEl.style.display="none";return false}
        return o.y<H+40});
      this.power=this.power.filter(o=>{
        if(o.lane===this.lane&&Math.abs(o.y+15*SCALE-cy)<30*SCALE){this.shield=2;sfx("shield",0.5);burst(o.lane,"#57d38c");return false}
        return o.y<H+40});
      for(const o of this.obs){
        if(o.lane===this.lane&&Math.abs(o.y+15*SCALE-cy)<30*SCALE){
          if(this.shield>0){this.shield--;this.combo=1;o.y=H+999;shake=9*SCALE;sfx("block",0.6);continue}
          this.die();return this}}
      if(this.frame%10===0)this.score+=this.combo;
      if(this.frame%400===0&&this.combo>1)this.combo--;
      if(this.frame%600===0)this.speed+=0.5;
      if(this.frame>90&&hintEl.style.display!=="none")hintEl.style.display="none";
    }
    return this},
  runUntilOver(max){for(let i=0;i<max&&this.state!=="over";i++)this.step(1);return this},
  probe(){return {state:this.state,score:this.score,combo:this.combo,bestCombo:this.bestCombo,coins:this.coins,
    shield:this.shield,best:this.best,lane:this.lane,frame:this.frame,obstacles:this.obs.length,
    fps:Math.round(fps),stage:[W,H],fontSizePx:parseFloat(getComputedStyle(document.documentElement).fontSize)}}
};
function draw(){
  cx.save();
  if(shake>0.4){cx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);shake*=0.86}else shake=0
  cx.fillStyle="#0b1220";cx.fillRect(-20,-20,W+40,H+40);
  cx.strokeStyle="#17253c";cx.lineWidth=1;
  for(let l=1;l<LANES;l++){cx.beginPath();cx.moveTo(l*LANE_W,0);cx.lineTo(l*LANE_W,H);cx.stroke()}
  const s=Math.max(2,10*SCALE);
  cx.fillStyle="#ffd166";for(const o of sim.coinsRow){cx.beginPath();cx.arc(o.lane*LANE_W+LANE_W/2,o.y+15*SCALE,7*SCALE,0,6.284);cx.fill()}
  cx.fillStyle="#57d38c";for(const o of sim.power)cx.fillRect(o.lane*LANE_W+LANE_W*0.3,o.y+6*SCALE,LANE_W*0.4,LANE_W*0.4);
  cx.fillStyle="#ff6b5b";for(const o of sim.obs)cx.fillRect(o.lane*LANE_W+s,o.y,LANE_W-2*s,30*SCALE);
  cx.fillStyle=sim.shield>0?"#57d38c":"#5cc8ff";
  cx.fillRect(sim.lane*LANE_W+s*1.2,H-60*SCALE,LANE_W-2.4*s,30*SCALE);
  cx.fillStyle="#0b1220";cx.fillRect(0,-20,W,20);cx.fillRect(0,H,W,20);
  for(const p of parts){p.x+=p.vx;p.y+=p.vy;p.vy+=0.28*SCALE;p.life--;cx.fillStyle=p.color;cx.fillRect(p.x,p.y,3.4*SCALE,3.4*SCALE)}
  parts=parts.filter(p=>p.life>0);
  cx.restore();
  sEl.textContent=sim.score;cEl.textContent=sim.combo;bEl.textContent=sim.best;
}
let frames=0,t0=null,acc=0,last=performance.now(),fps=0;
function loop(now){
  if(t0===null)t0=now;frames++;
  const dt=Math.min(now-last,100);last=now;acc+=dt;
  while(acc>=16.67){acc-=16.67;sim.step(1)}
  draw();
  if(now-t0>500){fps=frames/((now-t0)/1000);frames=0;t0=null}
  requestAnimationFrame(loop)}
window.__game=sim;
sim.reset(1);resize();renderHudControls();requestAnimationFrame(loop);
</script></body></html>
