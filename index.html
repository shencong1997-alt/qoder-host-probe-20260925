<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Lane Dodger</title>
<script src="https://sdk.crazygames.com/crazygames-sdk-v2.js"></script>
<style>
/* Portal spec: no text selection, page must not scroll, canvas fills the frame. */
*{margin:0;padding:0;box-sizing:border-box;user-select:none;-webkit-user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#05070b;
  font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;color:#e8ecf4}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
canvas{display:block;background:#0b1220;image-rendering:auto}
#hud{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;
  padding:10px 14px;font-size:18px;font-weight:700;pointer-events:none;
  font-variant-numeric:tabular-nums;text-shadow:0 1px 3px #000}
#over{position:absolute;inset:0;display:none;align-items:center;justify-content:center;
  flex-direction:column;gap:12px;background:rgba(5,7,11,.82);text-align:center}
#over.on{display:flex}
#over h2{font-size:min(8vw,44px)}
#over p{font-size:min(4.5vw,20px);color:#9aa6bd}
</style></head>
<body>
<div id="wrap">
  <canvas id="cv" width="420" height="560"></canvas>
  <div id="hud"><span>SCORE <b id="s">0</b></span><span>BEST <b id="b">0</b></span></div>
  <div id="over"><h2>GAME OVER</h2><p>Press SPACE or tap to play again</p></div>
</div>
<script>
"use strict";
const LANES=5;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const cv=document.getElementById("cv"),cx=cv.getContext("2d"),
      overEl=document.getElementById("over"),sEl=document.getElementById("s"),bEl=document.getElementById("b");
let W=0,H=0,LANE_W=0,SCALE=1;

// Portal requires legibility at many window sizes: layout is resolution-driven,
// never a fixed pixel box.
function resize(){
  const aw=innerWidth,ah=innerHeight,dpr=Math.min(devicePixelRatio||1,2);
  const ar=0.75;                                  // portrait-friendly 3:4 stage
  let h=Math.min(ah,900),w=h*ar;
  if(w>aw){w=aw;h=w/ar}
  W=Math.round(w);H=Math.round(h);LANE_W=W/LANES;SCALE=h/560;
  cv.width=W;cv.height=H;cv.style.width=W+"px";cv.style.height=H+"px";
  document.documentElement.style.fontSize=Math.max(14,Math.round(16*SCALE))+"px";
  if(sim.state==="running")sim.step(0);draw();
}
addEventListener("resize",resize);
addEventListener("wheel",e=>e.preventDefault(),   {passive:false});
addEventListener("keydown",e=>{
  if(["ArrowLeft","ArrowRight","ArrowUp","ArrowDown","Space"].includes(e.code))e.preventDefault();
  if(e.code==="ArrowLeft")sim.key("ArrowLeft");
  else if(e.code==="ArrowRight")sim.key("ArrowRight");
  else if(e.code==="Space"&&sim.state==="over")sim.restart();
  draw();
},{passive:false});
cv.addEventListener("pointerdown",e=>{
  if(sim.state==="over"){sim.restart();draw();return}
  sim.key(e.clientX<innerWidth/2?"ArrowLeft":"ArrowRight");draw()});

const CG = (typeof window.CrazyGames!=="undefined") ? window.CrazyGames : null;
function sdkEvent(n){ try{ if(CG&&CG.SDK&&typeof CG.SDK[n]==="function")CG.SDK[n](); }catch(e){} }

const sim={
  seed:1,rng:null,frame:0,lane:2,score:0,best:0,state:"ready",obs:[],speed:4,nextRow:60,
  framesToOver:-1,adRequested:0,
  reset(seed){this.seed=seed||1;this.rng=mulberry32(this.seed);this.frame=0;this.lane=2;this.score=0;
    this.state="ready";this.obs=[];this.speed=4;this.nextRow=60;this.framesToOver=-1;sdkEvent("LoadingStop");return this},
  restart(){this.reset(this.seed);this.start()},
  start(){if(this.state==="running")return;this.state="running";sdkEvent("GameplayStart")},
  pause(){if(this.state==="running"){this.state="paused";sdkEvent("GameplayEnd")}
          else if(this.state==="ready")this.start()},
  key(k){ if(k==="ArrowLeft"&&this.lane>0)this.lane--;
          else if(k==="ArrowRight"&&this.lane<LANES-1)this.lane++; return this.lane},
  step(n){ n=n||1;
    for(let i=0;i<n;i++){
      if(this.state!=="running"){if(this.state==="ready")this.start();else continue}
      this.frame++;
      // Fairness rule: obstacles arrive as rows, and every row must leave an
      // escape lane. Per-frame random spawns made even optimal play die in ~7s.
      if(this.frame>=this.nextRow){
        const k=this.frame<1200?1:(this.rng()<0.35?2:1);
        const lanes=[0,1,2,3,4];for(let i=lanes.length-1;i>0;i--){const j=Math.floor(this.rng()*(i+1));const t=lanes[i];lanes[i]=lanes[j];lanes[j]=t}
        for(let i=0;i<k;i++)this.obs.push({y:-30,lane:lanes[i]});
        this.nextRow=this.frame+Math.max(26,Math.round(96-this.frame/220));
      }
      for(const o of this.obs)o.y+=this.speed*SCALE;
      this.obs=this.obs.filter(o=>o.y<H+40);
      const py=H-60*SCALE;
      for(const o of this.obs)
        if(o.lane===this.lane&&Math.abs((o.y+15*SCALE)-(py+15*SCALE))<30*SCALE){
          this.state="over";this.framesToOver=this.frame;
          if(this.score>this.best)this.best=this.score;
          sdkEvent("GameplayEnd");overEl.classList.add("on");
          try{ if(CG&&CG.SDK&&CG.SDK.requestAd){this.adRequested++;CG.SDK.requestAd("midgame")} }catch(e){}
          return this}
      if(this.frame%10===0)this.score++;
      if(this.frame%600===0)this.speed+=0.5;
    }
    return this},
  runUntilOver(max){for(let i=0;i<max&&this.state!=="over";i++)this.step(1);return this},
  probe(){return {state:this.state,score:this.score,lane:this.lane,frame:this.frame,
    best:this.best,obstacles:this.obs.length,fps:Math.round(fps),stage:[W,H],
    dpr:devicePixelRatio,fontSizePx:parseFloat(getComputedStyle(document.documentElement).fontSize)}}
};
function draw(){
  cx.fillStyle="#0b1220";cx.fillRect(0,0,W,H);
  cx.strokeStyle="#17253c";cx.lineWidth=1;
  for(let l=1;l<LANES;l++){cx.beginPath();cx.moveTo(l*LANE_W,0);cx.lineTo(l*LANE_W,H);cx.stroke()}
  cx.fillStyle="#ff6b5b";for(const o of sim.obs)cx.fillRect(o.lane*LANE_W+10*SCALE,o.y,LANE_W-20*SCALE,30*SCALE);
  cx.fillStyle="#5cc8ff";cx.fillRect(sim.lane*LANE_W+12*SCALE,H-60*SCALE,LANE_W-24*SCALE,30*SCALE);
  sEl.textContent=sim.score;bEl.textContent=sim.best;
}
let frames=0,t0=null,acc=0,last=performance.now(),fps=0;
function loop(now){
  if(t0===null)t0=now;frames++;
  const dt=Math.min(now-last,100);last=now;acc+=dt;
  while(acc>=16.67){acc-=16.67;sim.step(1)}
  draw();
  if(now-t0>500){fps=frames/((now-t0)/1000);frames=0;t0=null}
  requestAnimationFrame(loop)}
window.__game=sim;
sim.reset(1);resize();requestAnimationFrame(loop);
</script></body></html>
