<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CSV 文字化けチェック & UTF-8(BOM) 変換｜アップロードなし</title>
<meta name="description" content="CSV をサーバーに送らずにブラウザ内だけで Shift-JIS / EUC-JP / UTF-8 を自動判別し、UTF-8(BOM 付き) に変換して Excel の文字化けを直します。">
<style>
:root{--bg:#0b0e14;--fg:#e8ecf4;--mut:#9aa6bd;--acc:#5cc8ff;--ok:#57d38c;--no:#ff7b72;--line:#222836}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:820px;margin:0 auto;padding:32px 20px 64px}
h1{font-size:clamp(22px,4vw,32px);line-height:1.25;margin:0 0 6px}
p.lead{color:var(--mut);margin:0 0 26px}
.card{background:#111725;border:1px solid var(--line);border-radius:14px;padding:20px;margin:0 0 18px}
label{display:block;font-size:14px;color:var(--mut);margin:0 0 8px}
input[type=file],select{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:#0d1220;color:var(--fg);font:inherit}
button{font:inherit;padding:12px 18px;border-radius:10px;border:0;background:var(--acc);color:#04121b;font-weight:650;cursor:pointer}
button:disabled{opacity:.4;cursor:not-allowed}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line)}
th{color:var(--mut);font-weight:600}
.ok{color:var(--ok)}.no{color:var(--no)}
pre{background:#0d1220;border:1px solid var(--line);border-radius:10px;padding:12px;overflow:auto;font-size:13px;max-height:200px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
footer{color:var(--mut);font-size:13px;margin-top:26px}
a{color:var(--acc)}
</style>
</head>
<body>
<main>
<h1>CSV 文字化けチェック &amp; UTF-8(BOM) 変換</h1>
<p class="lead">ファイルをサーバーに送らず、このページの中でだけ解析します。銀行・顧客リストのような社外に出せない CSV に使えます。</p>

<div class="card">
  <label for="f">1. CSV ファイルを選ぶ（この端末内で完結します）</label>
  <input type="file" id="f" accept=".csv,.txt,.tsv">
  <div class="row" style="margin-top:14px">
    <div style="flex:1;min-width:180px">
      <label for="enc">文字コード（自動のときは Auto を置きます）</label>
      <select id="enc">
        <option value="">自動判定</option>
        <option value="shift_jis">Shift-JIS (CP932)</option>
        <option value="euc-jp">EUC-JP</option>
        <option value="utf-8">UTF-8</option>
        <option value="windows-1252">Windows-1252</option>
        <option value="gb18030">GB18030</option>
      </select>
    </div>
    <div style="flex:1;min-width:180px">
      <label>区切り</label>
      <select id="delim"><option value="">自動</option><option value=",">カンマ</option><option value="&#9;">タブ</option><option value=";">セミコロン</option></select>
    </div>
  </div>
</div>

<div class="card" id="report" hidden>
  <h2 style="margin:0 0 12px;font-size:18px">2. 判定結果</h2>
  <table><thead><tr><th>項目</th><th>値</th></tr></thead><tbody id="tbody"></tbody></table>
  <h3 style="margin:18px 0 8px;font-size:15px">先頭 5 行のプレビュー</h3>
  <pre id="pre"></pre>
  <button id="dl" style="margin-top:14px">UTF-8 (BOM 付き) CSV を保存</button>
  <span id="state" style="margin-left:10px;color:var(--mut)"></span>
</div>

<footer>
  動作しない場合、Excel が開けない行（引用符の不整合）が原因です。テーブルの「行数」と「列数のばらつき」を見て該当行を特定してください。
</footer>
</main>

<script>
"use strict";
const CANDIDATES = ["utf-8","shift_jis","euc-jp","gb18030","windows-1252"];
const $ = s => document.querySelector(s);
// window.__result is the machine-checkable surface used by the automated test.
window.__result = null;

function tryDecode(bytes, enc) {
  try { return new TextDecoder(enc, {fatal:true}).decode(bytes); } catch (e) { return null; }
}
function cjkRatio(s){ const c=(s.match(/[\u3000-\u30ff\u4e00-\u9fff\uff00-\uffef]/g)||[]).length; return c/Math.max(s.length,1); }
function detect(bytes){
  const scored = [];
  for (const enc of CANDIDATES){
    const t = tryDecode(bytes, enc);
    if (t === null) continue;
    let score = 0;
    if (enc === "utf-8") score += 2;
    if (enc === "shift_jis") score += 1.5;
    if (enc === "euc-jp") score += 1.2;
    if (cjkRatio(t) > 0.02) score += 1;
    const bad = (t.match(/\uFFFD/g)||[]).length;
    score -= bad * 0.5;
    scored.push({enc, t, score});
  }
  scored.sort((a,b)=>b.score-a.score);
  return {best: scored[0]||null, all: scored};
}
function sniffDelim(text){
  const head = text.split(/\r?\n/).slice(0,5).join("\n");
  const counts = {",":0,"\t":0,";":0};
  for (const ch of head) if (ch in counts) counts[ch]++;
  return Object.keys(counts).sort((a,b)=>counts[b]-counts[a])[0] || ",";
}
// RFC4180-ish parser honouring quotes and CRLF inside quoted fields.
function parse(text, d){
  const rows=[]; let row=[], cell="", q=false, cols=0, quoteErr=0;
  for (let i=0;i<text.length;i++){
    const ch=text[i];
    if (q){
      if (ch==='"'){ if (text[i+1]==='"'){cell+='"';i++;} else q=false; }
      else cell+=ch;
    } else {
      if (ch==='"') q=true;
      else if (ch===d){ row.push(cell); cell=""; }
      else if (ch==="\n"){ row.push(cell); rows.push(row); row=[]; cell=""; }
      else if (ch==="\r"){ if (text[i+1]!=="\n") row.push(cell), rows.push(row), row=[], cell=""; }
      else cell+=ch;
    }
  }
  if (cell!=="" || row.length){ row.push(cell); rows.push(row); }
  if (q) quoteErr = 1;
  const widths = rows.map(r=>r.length);
  cols = widths.length ? Math.max(...widths) : 0;
  const ragged = widths.filter(w=>w!==cols).length;
  return {rows, cols, rows_n: rows.length, ragged, quoteErr,
          crlf: /\r\n/.test(text), maxCol: Math.max(0,...widths), minCol: Math.min(9e9,...widths)};
}
function toUtf8Bom(text){
  const bom = new Uint8Array([0xEF,0xBB,0xBF]);
  const body = new TextEncoder().encode(text);
  const out = new Uint8Array(bom.length+body.length); out.set(bom); out.set(body,bom.length);
  return out;
}

let lastOut = null, lastRows = null;
$("#f").addEventListener("change", async e => {
  const file = e.target.files[0]; if (!file) return;
  const bytes = new Uint8Array(await file.arrayBuffer());
  const forced = $("#enc").value;
  const det = forced ? {best:{enc:forced,t:tryDecode(bytes,forced)||"",score:99}} : detect(bytes);
  if (!det.best){ $("#state").textContent="解読不可"; return; }
  const text = det.best.t;
  const d = $("#delim").value || sniffDelim(text);
  const p = parse(text, d);
  const cleaned = text.replace(/^\uFEFF/,"");
  const out = toUtf8Bom(cleaned.replace(/\r?\n/g,"\r\n"));
  lastOut = out; lastRows = p.rows;

  const bom = bytes.length>2 && bytes[0]===0xEF && bytes[1]===0xBB && bytes[2]===0xBF;
  $("#tbody").innerHTML = [
    ["ファイルサイズ", file.size.toLocaleString() + " bytes"],
    ["検出した文字コード", '<b class="ok">'+det.best.enc+'</b>' + (forced?"（手動指定）":"")],
    ["BOM", bom ? "あり" : "なし"],
    ["区切り文字", d==="\t" ? "タブ" : d],
    ["行数", String(p.rows_n)],
    ["列数", p.cols + (p.ragged ? ' <b class="no">(ばらつき '+p.ragged+' 行)</b>' : ' <b class="ok">(全行一致)</b>')],
    ["改行", p.crlf ? "CRLF" : "LF"],
    ["引用符の閉じ忘れ", p.quoteErr ? '<b class="no">あり</b>' : '<b class="ok">なし</b>'],
    ["文字化けリスク", cjkRatio(text)>0.01 ? '<b class="ok">低（日本語が含まれるため解読成功）</b>' : "判定参考：CJK 文字 0"]
  ].map(r=>"<tr><th>"+r[0]+"</th><td>"+r[1]+"</td></tr>").join("");
  $("#pre").textContent = p.rows.slice(0,5).map(r=>r.join(" | ")).join("\n");
  $("#report").hidden = false;
  $("#dl").disabled = false;
  $("#state").textContent = "";

  window.__result = {encoding: det.best.enc, bomPresent: bom, delim: d==="	"?"TAB":d,
    rows: p.rows_n, cols: p.cols, ragged: p.ragged, crlf: p.crlf, quoteErr: !!p.quoteErr,
    outBytes: out.length, outHasBom: out[0]===0xEF&&out[1]===0xBB&&out[2]===0xBF,
    previewFirstCell: (p.rows[0]||[])[0]||"", previewRow2First: (p.rows[1]||[])[0]||"",
    cjkRatio: +cjkRatio(text).toFixed(4), altCandidates: det.all.map(a=>a.enc)};
});
$("#dl").addEventListener("click", () => {
  if (!lastOut) return;
  const url = URL.createObjectURL(new Blob([lastOut], {type:"text/csv;charset=utf-8"}));
  const a = document.createElement("a"); a.href=url; a.download="converted_utf8_bom.csv"; a.click();
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
  $("#state").textContent = "保存しました";
});

</script>
</body>
</html>
