<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Stack Tight</title>
<meta name="description" content="Drop each slab with perfect timing. Overhang gets trimmed, and only clean stacks survive.">
<script src="https://sdk.crazygames.com/crazygames-sdk-v2.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;user-select:none;-webkit-user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#070a10;
  font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;color:#e8ecf4}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
canvas{display:block;background:#0d1420}
#hud{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;
  padding:2.4% 3%;font-size:18px;font-weight:700;pointer-events:none;
  font-variant-numeric:tabular-nums;text-shadow:0 1px 3px #000}
#hud .perf{color:#57d38c}
#hint{position:absolute;left:0;right:0;bottom:16%;text-align:center;font-size:min(4.5vw,19px);
  color:#cfd8ea;pointer-events:none;text-shadow:0 1px 3px #000}
#over{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;
  justify-content:center;gap:10px;background:rgba(7,10,16,.86);text-align:center;padding:6%}
#over.on{display:flex}
#over h2{font-size:min(9vw,44px);margin:0}
#over .stats{font-size:min(5vw,21px);color:#cfd8ea;font-variant-numeric:tabular-nums}
#over .hint{font-size:min(4vw,17px);color:#9aa6bd}
#mute{position:absolute;top:1.5%;right:1.5%;padding:1.2% 2.4%;min-width:34px;border:0;border-radius:9px;background:rgba(13,18,32,.72);color:#e8ecf4;font-size:15px;cursor:pointer}
</style></head>
<body>
<div id="wrap">
  <canvas id="cv" width="360" height="640"></canvas>
  <div id="hud"><span>STACK <b id="s">0</b></span><span class="perf">PERFECT <b id="p">0</b></span><span>BEST <b id="b">0</b></span></div>
  <div id="hint">TAP or SPACE to drop</div>
  <div id="over"><h2>STACK LOST</h2><p class="stats" id="stats"></p><p class="hint">TAP or SPACE to build again</p></div>
</div>
<script>
"use strict";
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const cv=document.getElementById("cv"),cx=cv.getContext("2d"),
      sEl=document.getElementById("s"),pEl=document.getElementById("p"),bEl=document.getElementById("b"),
      stEl=document.getElementById("stats"),overEl=document.getElementById("over"),hintEl=document.getElementById("hint");
const CG=(typeof window.CrazyGames!=="undefined")?window.CrazyGames:null;
function sdkEvent(n){try{if(CG&&CG.SDK&&typeof CG.SDK[n]==="function")CG.SDK[n]()}catch(e){}}
function store(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
let W=0,H=0,UNIT=1,SHAKE=0;

function layout(){
  const aw=innerWidth,ah=innerHeight;
  let h=Math.min(ah,900),w=h*0.5625;
  if(w>aw){w=aw;h=w/0.5625}
  W=Math.round(w);H=Math.round(h);UNIT=H/640;
  cv.width=W;cv.height=H;cv.style.width=W+"px";cv.style.height=H+"px";
  document.documentElement.style.fontSize=Math.max(14,Math.round(17*UNIT))+"px";
  draw();
}
addEventListener("resize",layout);
addEventListener("wheel",e=>e.preventDefault(),{passive:false});
addEventListener("keydown",e=>{
  if(["ArrowLeft","ArrowRight","ArrowUp","ArrowDown","Space"].includes(e.code))e.preventDefault();
  if(e.code==="Space"||e.code==="ArrowDown")sim.drop();
},{passive:false});
cv.addEventListener("pointerdown",e=>{e.preventDefault();sim.drop()},{passive:false});

const ROW_H_RATIO=0.055;

const SFXN=["trim","perfect","die"];
const AC=window.AudioContext||window.webkitAudioContext;
let actx=null,bufs={},muted=store("st_muted")=="1",shake=0;
const muteEl=document.createElement("button");
muteEl.id="mute";muteEl.type="button";muteEl.setAttribute("aria-label","toggle sound");
document.getElementById("wrap").appendChild(muteEl);
function audioWake(){if(actx||!AC)return;try{actx=new AC();
 for(const n of SFXN)fetch(n+".ogg").then(r=>r.arrayBuffer()).then(b=>actx.decodeAudioData(b)).then(a=>bufs[n]=a).catch(()=>{})}catch(e){actx=null}}
function sfx(n,v){if(muted||!actx||!bufs[n])return;try{const s=actx.createBufferSource(),g=actx.createGain();
 s.buffer=bufs[n];g.gain.value=v===undefined?0.5:v;s.connect(g);g.connect(actx.destination);s.start()}catch(e){}}
function renderMute(){muteEl.textContent=muted?"SOUND OFF":"SOUND ON";muteEl.style.opacity=muted?.55:1}
muteEl.addEventListener("click",e=>{e.stopPropagation();muted=!muted;store("st_muted",muted?"1":"0");renderMute()});
addEventListener("pointerdown",audioWake);addEventListener("keydown",audioWake);
document.addEventListener("visibilitychange",()=>{if(document.hidden&&sim.state==="running")sim.pause()});

const sim={
  seed:1,rng:null,state:"ready",rows:0,perfect:0,best:+(store("st_best")||0),
  stack:[],cur:null,dir:1,speed:2.4,rowH:0,framesToLoss:-1,frame:0,
  rowHeight(){return Math.round(H*ROW_H_RATIO)},
  tolNow(){return Math.max(3,Math.round(7*UNIT*Math.max(0.30,1-this.rows/70)))},
  reset(seed){
    this.seed=seed||1;this.rng=mulberry32(this.seed);this.state="ready";this.rows=0;this.score=0;this.perfect=0;
    this.frame=0;this.framesToLoss=-1;this.rowH=this.rowHeight();
    const baseW=Math.round(W*0.44);
    this.stack=[{x:Math.round((W-baseW)/2),w:baseW}];
    this.spawn();sdkEvent("LoadingStop");overEl.classList.remove("on");hintEl.style.display="";return this},
  restart(){this.reset(this.seed);this.start()},
  start(){if(this.state==="running")return;this.state="running";sdkEvent("GameplayStart")},
  pause(){if(this.state==="running"){this.state="paused";sdkEvent("GameplayEnd")}else if(this.state==="ready")this.start()},
  spawn(){
    const top=this.stack[this.stack.length-1];
    const w=top.w, fromLeft=(this.stack.length%2)===1;
    this.dir=fromLeft?1:-1;
    this.cur={x:fromLeft?-w:W, w:w};
    // Cap derived from the live window keeps 2*tol/speed at ~1.9 frames, so an
    // unavoidable wall cannot appear; all difficulty comes from a tightening tol.
    this.speed=Math.min((2.4+this.stack.length*0.075)*UNIT, this.tolNow()*1.05);
  },
  // Geometry of the drop, exposed so the balance of the game can be asserted
  // rather than eyeballed: overlap width, trim amount and perfect tolerance.
  evaluate(){
    const top=this.stack[this.stack.length-1],c=this.cur;
    const lo=Math.max(top.x,c.x),hi=Math.min(top.x+top.w,c.x+c.w);
    const ov=hi-lo;
    // Human aiming noise is roughly constant in pixels, so escalation has to
    // tighten the window itself; shrinking only the slab left runs unbounded.
    const PERF=this.tolNow();
    const offset=Math.abs((c.x+c.w/2)-(top.x+top.w/2));
    return {overlap:ov,offset:Math.round(offset),perfect:ov>0&&offset<=PERF,tol:PERF,miss:ov<=0,trim:Math.max(0,top.w-ov)}},
  drop(){
    if(this.state==="over"){this.restart();return}
    if(this.state!=="running")this.start();
    const e=this.evaluate();
    if(e.miss){this.lose(e);return}
    const top=this.stack[this.stack.length-1];
    const lo=Math.max(top.x,this.cur.x),hi=Math.min(top.x+top.w,this.cur.x+this.cur.w);
    if(e.perfect){this.perfect++;sfx("perfect",0.5);
      // Without a pressure term independent of aim, a consistently in-tolerance
      // player never shrinks and runs never end (measured: hit the 400-row cap).
      const w=this.rows>5?Math.max(8,Math.round(top.w*0.985)):top.w;
      const keepX=this.rows>5?Math.round(top.x+(top.w-w)/2):top.x;
      this.stack.push({x:keepX,w:w});this.score+=3}
    else {this.stack.push({x:lo,w:hi-lo});sfx("trim",0.45)}
    this.rows++;this.score++;hintEl.style.display="none";SHAKE=e.perfect?0:3*UNIT;
    if(this.rows%5===0)this.speed=Math.min(this.speed*1.06,this.tolNow()*1.05);
    this.spawn();draw();
    if(this.stack.length>260)this.stack.splice(1,1);
  },
  lose(e){
    this.state="over";this.framesToLoss=this.frame;
    if(this.score>this.best){this.best=this.score;store("st_best",String(this.score))}
    sdkEvent("GameplayEnd");SHAKE=14*UNIT;sfx("die",0.6);
    stEl.textContent="SCORE "+this.score+"  ·  STACK "+this.rows+"  ·  PERFECT "+this.perfect;
    overEl.classList.add("on");
    try{if(CG&&CG.SDK&&CG.SDK.requestAd){this.adRequested=(this.adRequested||0)+1;CG.SDK.requestAd("midgame")}}catch(err){}
    draw()},
  step(n){
    n=n||1;
    for(let i=0;i<n;i++){
      if(this.state!=="running"){if(this.state==="ready")this.start();else continue}
      this.frame++;
      this.cur.x+=this.dir*this.speed;
      if(this.cur.x+this.cur.w>W+40){this.cur.x=W+40-this.cur.w;this.dir=-1}
      else if(this.cur.x<-40){this.cur.x=-40;this.dir=1}
    }
    return this},
  probe(){const e=this.cur?this.evaluate():{};
    return {state:this.state,rows:this.rows,score:this.score,perfect:this.perfect,best:this.best,
      width:this.cur?Math.round(this.cur.w):0,overlap:e.overlap,offset:e.offset,tol:e.tol,
      fps:Math.round(fps),stage:[W,H],fontSizePx:parseFloat(getComputedStyle(document.documentElement).fontSize)}}
};
function draw(){
  cx.save();
  if(SHAKE>0.4){cx.translate((Math.random()-0.5)*SHAKE,(Math.random()-0.5)*SHAKE);SHAKE*=0.86}else SHAKE=0;
  cx.fillStyle="#0d1420";cx.fillRect(-30,-30,W+60,H+60);
  const rh=sim.rowH||sim.rowHeight();
  const camTop=Math.max(0,sim.stack.length-9);
  for(let i=0;i<sim.stack.length;i++){
    const r=sim.stack[i],y=H-rh-(i-camTop)*rh;
    if(y<-rh||y>H+rh)continue;
    const hue=(190+i*6)%360;
    cx.fillStyle=i===sim.stack.length-1?"hsl("+hue+",62%,66%)":"hsl("+hue+",42%,"+(38+((i%3)*5))+"%)";
    cx.fillRect(r.x,y,r.w,rh-2*UNIT);
  }
  if(sim.cur&&sim.state!=="over"){
    const y=H-rh-(sim.stack.length-camTop)*rh;
    cx.fillStyle="#ffd166";cx.fillRect(sim.cur.x,y,sim.cur.w,rh-2*UNIT);
    const top=sim.stack[sim.stack.length-1];
    cx.strokeStyle="rgba(87,211,140,.75)";cx.lineWidth=Math.max(1,2*UNIT);
    cx.beginPath();cx.moveTo(top.x+top.w/2,y);cx.lineTo(top.x+top.w/2,y+rh);cx.stroke();
  }
  cx.restore();
  sEl.textContent=sim.rows;pEl.textContent=sim.perfect;bEl.textContent=sim.best;
}
let frames=0,t0=null,acc=0,last=performance.now(),fps=0;
function loop(now){
  if(t0===null)t0=now;frames++;
  const dt=Math.min(now-last,100);last=now;acc+=dt;
  while(acc>=16.67){acc-=16.67;sim.step(1)}
  draw();
  if(now-t0>500){fps=frames/((now-t0)/1000);frames=0;t0=null}
  requestAnimationFrame(loop)}
window.__game=sim;
sim.reset(1);layout();renderMute();requestAnimationFrame(loop);
</script></body></html>
